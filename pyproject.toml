[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intellicode"
version = "1.0.0"
description = "Hybrid RAG system with AST-powered Python code analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Divyansh"}]
dependencies = [
    # Upper bounds are deliberate: transformers 5.x currently ships a broken
    # accelerate integration, and numpy 2.x breaks the prebuilt scipy/faiss ABI
    # on common toolchains. These pins are the validated, CI-green stack.
    "sentence-transformers>=3.0,<4.0",
    "transformers>=4.40,<4.46",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24,<2",
    "rank-bm25>=0.2.2",
    "torch>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
app = ["gradio>=4.44.0", "pypdf>=5.0.0", "spaces", "accelerate>=0.27.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4.0"]
eval = ["tabulate>=0.9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Fixtures under tests/fixtures are intentionally-buggy analyzer inputs — not
# code to be linted.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "eval: marks evaluation benchmarks (may be slow)",
    "slow: marks tests that download models or are otherwise slow",
]
